name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & syntax check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff==0.16.9 pytest==9.1.1
          pip install --require-hashes -r requirements-lock.txt

      - name: Ruff — lint
        run: ruff check .

      - name: Unit tests
        run: python -m pytest -q tests/unit

      - name: Version consistent (version.json, CHANGELOG.md, CITATION.cff)
        run: python scripts/check_version.py

      - name: Syntax check (all .py files)
        run: |
          find . -name "*.py" -not -path "./venv/*" -not -path "./.git/*" \
            | xargs python -m py_compile

  a11y:
    name: Accessibility (axe-core)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Install Playwright (Chromium) and axe-core
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
          npm install --no-save axe-core@4.10.2

      - name: Widget and pages — axe-core, keyboard, announcements, answer structure
        run: python tests/a11y/check.py
