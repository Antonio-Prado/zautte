name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & syntax check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (every file checked against its hash)
        run: pip install --require-hashes -r requirements-lock.txt -r requirements-ci-lock.txt

      - name: Ruff — lint
        run: ruff check .

      - name: Unit tests
        run: python -m pytest -q tests/unit

      - name: Version consistent (version.json, CHANGELOG.md, CITATION.cff)
        run: python scripts/check_version.py

      - name: Syntax check (all .py files)
        run: |
          find . -name "*.py" -not -path "./venv/*" -not -path "./.git/*" \
            | xargs python -m py_compile

  a11y:
    name: Accessibility (axe-core)
    # Pinned: on ubuntu-latest (26.04) `playwright install --with-deps` cannot find its font packages.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Install Playwright (Chromium) and axe-core
        run: |
          pip install --require-hashes -r requirements-a11y-lock.txt
          python -m playwright install --with-deps chromium
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Widget and pages — axe-core, keyboard, announcements, answer structure
        run: python tests/a11y/check.py

  audit:
    name: Known vulnerabilities in the dependencies (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Install pip-audit (hashed)
        run: |
          python -m venv /tmp/audit
          /tmp/audit/bin/pip install --require-hashes -r requirements-audit-lock.txt

      - name: Audit the locks against the advisory databases
        run: |
          /tmp/audit/bin/pip-audit --strict --disable-pip --require-hashes -r requirements-lock.txt
          /tmp/audit/bin/pip-audit --strict --disable-pip --require-hashes -r requirements-bedrock-lock.txt
