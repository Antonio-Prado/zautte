version: 2

updates:
  # Dipendenze Python
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      # pyee only comes in through Playwright, which pins pyee<14
      - dependency-name: "pyee"
        update-types: ["version-update:semver-major"]
      # anthropic 2.x sends API version 2026-10-21: no temperature, and Bedrock only for Claude 4.7+
      - dependency-name: "anthropic"
        update-types: ["version-update:semver-major"]
      # Deprecated 3.x requires Python 3.12 (CI and production run 3.11)
      - dependency-name: "deprecated"
        update-types: ["version-update:semver-major"]
      # botocore (Bedrock) requires python-dateutil<3
      - dependency-name: "python-dateutil"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # axe-core for the accessibility tests (package-lock.json)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
