# newsyslog configuration for the municipal chatbot
# Copy to /etc/newsyslog.conf.d/chatbot.conf
#
# Column format:
# logfile          owner:group  mode  count  size(KB)  when  flags  [pid_file  signal]
#
# chatbot.log contains client IPs (uvicorn access log): it rotates every
# day at midnight and 90 files are kept, i.e. 90 days; older ones are
# deleted (change the count to match the retention in your privacy notice). SIGHUP (1) to the daemon in /var/run/chatbot.pid makes it reopen the
# file (rc.d starts daemon with -H).

/var/log/chatbot.log         root:wheel  640  90  *  @T00  J  /var/run/chatbot.pid  1
/var/log/chatbot-sync.log    zsync:zautte  640  14  102400  *  J
/var/log/chatbot-crawler.log root:wheel  640  14  51200  *  J
/var/log/chatbot-indexer.log root:wheel  640  14  51200  *  J
