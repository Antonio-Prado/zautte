# Configurazione newsyslog per il chatbot comunale
# Copiare in /etc/newsyslog.conf.d/chatbot.conf
#
# Formato colonne:
# logfile          owner:group  mode  count  size(KB)  when  flags  [pid_file  signal]
#
# chatbot.log contiene l'IP dei client (log di accesso di uvicorn): ruota ogni
# giorno a mezzanotte e si tengono 365 file, cioè un anno; più vecchi si
# cancellano. Il SIGHUP (1) al daemon di /var/run/chatbot.pid gli fa riaprire il
# file (rc.d avvia daemon con -H).

/var/log/chatbot.log         root:wheel  640  365  *  @T00  J  /var/run/chatbot.pid  1
/var/log/chatbot-sync.log    root:wheel  640  14  102400  *  J
/var/log/chatbot-crawler.log root:wheel  640  14  51200  *  J
/var/log/chatbot-indexer.log root:wheel  640  14  51200  *  J
