<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Restricted access — Zautte</title>
  <link rel="icon" href="/widget/zautte-favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/widget/dashboard.css?v=20261019a">
  <style id="area-css"></style>
  <style>
    #key-form, #user-form { width: 100%; max-width: 640px; margin: 10px 0 14px; padding: 14px 20px; background: #fff;
      border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.06); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    #key-form label, #user-form label { flex-basis: 100%; font-weight: bold; color: #003366; }
    #key-form input, #user-form input { flex: 1; min-width: 180px; padding: 8px 10px; border: 1px solid #99a; border-radius: 6px; font-size: 1em; }
    #user-form input { flex-basis: 100%; }
    #key-form button, #user-form button { background: #003366; color: #fff; border: 0; border-radius: 6px; padding: 9px 18px; font-size: 1em; cursor: pointer; }
    #key-form button:disabled, #user-form button:disabled { opacity: .5; cursor: default; }
    #key-msg, #user-msg { flex-basis: 100%; margin: 0; min-height: 1.2em; color: #c62828; font-size: .9em; }
    #key-form[hidden] { display: none; }
    #key-toggle { width: 100%; max-width: 640px; margin: 0 0 14px; font-size: .9em; }
    #key-toggle button { background: none; border: 0; padding: 0; color: #003366; text-decoration: underline; cursor: pointer; font-size: 1em; }
  </style>
</head>
<body class="user-view">
  <div class="page-head">
    <h1><img class="brand-logo" src="/widget/zautte-logo.svg" alt="Zautte" width="160" height="36">Restricted access</h1>
    <div id="session-box" style="display:none">
      <span id="session-name"></span>
      <button type="button" class="btn-logout" id="logout-btn">Log out</button>
    </div>
  </div>

  <form id="user-form">
    <label for="user-email">Email</label>
    <input type="email" id="user-email" autocomplete="username" required>
    <label for="user-password">Password</label>
    <input type="password" id="user-password" autocomplete="current-password" required>
    <button type="submit" id="user-btn">Log in</button>
    <p id="user-msg" role="alert"></p>
  </form>
  <div id="key-toggle"><button type="button" id="key-toggle-btn" aria-expanded="false" aria-controls="key-form">Log in with the access key</button></div>

  <form id="key-form" autocomplete="off" hidden>
    <label for="key-input">Access key</label>
    <input type="password" id="key-input" autocomplete="off" required>
    <button type="submit" id="key-btn">Log in</button>
    <p id="key-msg" role="alert"></p>
  </form>

  <div id="chat-area" style="display:none"></div>

  <script>
    const apiBase = window.location.origin;
    const ADMIN_KEY_LS = 'zautte_admin_key';
    const ADMIN_TOKEN_SS = 'zautte_admin_token';
    let _adminKey = null;
    let _adminToken = null;   // session of an account with the administrator role
    // Key and session live only as long as the tab (sessionStorage): an old key left in localStorage is removed.
    try { localStorage.removeItem(ADMIN_KEY_LS); } catch (_) {}
    try { _adminKey = sessionStorage.getItem(ADMIN_KEY_LS) || null; } catch (_) {}
    try { _adminToken = sessionStorage.getItem(ADMIN_TOKEN_SS) || null; } catch (_) {}

    // Only the name "gate": the rest (panel, scripts, styles) comes from the server only with
    // an administrator's session or a valid key; after too many wrong keys the address is blocked (429).
    function getAdminKey() { return _adminKey || ''; }
    function adminHeaders() {
      if (_adminToken) return { 'Authorization': 'Bearer ' + _adminToken };
      return _adminKey ? { 'X-Admin-Key': _adminKey } : {};
    }

    // A session in use is renewed by the server (X-Auth-Token) and ends after a while without
    // requests. The panel's own periodic refresh is not use: the token it brings back is ignored.
    let _polling = false;
    function _tokenUid(token) {
      try {
        const b = String(token).split('.')[0].replace(/-/g, '+').replace(/_/g, '/');
        return String(JSON.parse(decodeURIComponent(escape(atob(b + '='.repeat((4 - b.length % 4) % 4))))).uid || '');
      } catch (_) { return ''; }
    }
    function _adoptToken(token, announce) {
      if (!token || !_adminToken || token === _adminToken || _tokenUid(token) !== _tokenUid(_adminToken)) return;
      _adminToken = token;
      try { sessionStorage.setItem(ADMIN_TOKEN_SS, token); } catch (_) {}
      // the chat below the panel holds a copy of the same session
      if (announce) document.dispatchEvent(new CustomEvent('zautte:token', { detail: { token: token } }));
    }
    document.addEventListener('zautte:token', function (e) { _adoptToken(e.detail && e.detail.token, false); });
    function adminFetch(url, options) {
      const background = _polling;
      return fetch(url, options).then(function (r) {
        if (r.ok && !background) _adoptToken(r.headers.get('X-Auth-Token'), true);
        return r;
      });
    }

    let _keyError = '';
    let _panel = null;
    async function _validate(headers, refused) {
      _keyError = '';
      try {
        const r = await fetch(apiBase + location.pathname.replace(/\/+$/, '') + '/dati', { headers: headers });
        if (r.status === 429) {
          const m = Math.ceil((Number(r.headers.get('Retry-After')) || 0) / 60);
          _keyError = 'Too many attempts: try again in ' + (m || 'a few') + ' minutes.';
          return false;
        }
        if (!r.ok) { _keyError = refused; return false; }
        _panel = await r.json();
        return true;
      } catch (_) { _keyError = 'Service unreachable.'; return false; }
    }
    function _validateAdminKey(key) { return _validate({ 'X-Admin-Key': key }, 'Invalid key.'); }
    function _validateAdminToken(token) {
      return _validate({ 'Authorization': 'Bearer ' + token }, 'This account is not an administrator.');
    }

    let _user = { loggedIn: false, name: '' };
    let _statsStarted = false;
    function updateSessionBox() {
      const box = document.getElementById('session-box');
      const name = document.getElementById('session-name');
      const parts = [];
      if (_user.loggedIn && _user.name) parts.push(_user.name);
      if (_statsStarted) parts.push('administrator');
      name.textContent = parts.join(' · ');
      box.style.display = (_user.loggedIn || _statsStarted) ? '' : 'none';
    }

    function startAdminView() {
      if (_statsStarted || !_panel) return;
      _statsStarted = true;
      document.getElementById('key-form').style.display = 'none';
      document.getElementById('user-form').style.display = 'none';
      document.getElementById('key-toggle').style.display = 'none';
      document.getElementById('area-css').textContent = _panel.css;
      document.body.classList.replace('user-view', 'admin-view');
      const chat = document.getElementById('chat-area');
      chat.style.display = '';
      chat.insertAdjacentHTML('beforebegin', _panel.html);
      // the chat has a tab of its own in the panel; an older panel without it gets it at the end
      const slot = document.getElementById('chat-slot');
      const grid = document.getElementById('admin-grid');
      if (slot) slot.appendChild(chat);
      else if (grid) grid.after(chat);
      const s = document.createElement('script');
      s.textContent = _panel.js;
      document.body.appendChild(s);
      _panel = null;
      updateSessionBox();
      window.zautteAdminBoot();
      loadChat();
    }

    function loadChat() {
      window.ChatbotConfig = {
        apiUrl: window.location.origin, requireLogin: true, inline: '#chat-area', inlineHeight: '100%',
        primaryColor: '#003366', title: 'Zautte', subtitle: '', lang: 'it', logoUrl: '/widget/zautte-icon.svg',
        infoUrl: '/widget/come-funziona.html', position: 'right', contactEmail: '', suggestions: [],
      };
      const s = document.createElement('script');
      s.src = '/widget/chatbot-widget.js?v=20261019a';
      document.body.appendChild(s);
    }

    document.addEventListener('zautte:auth', function (e) {
      _user = e.detail || { loggedIn: false, name: '' };
      document.body.classList.toggle('logged-in', !!_user.loggedIn);
      updateSessionBox();
    });
    document.getElementById('logout-btn').addEventListener('click', function () {
      if (window.ZautteChatbot) window.ZautteChatbot.logout();
      _adminKey = null;
      _adminToken = null;
      try { sessionStorage.removeItem(ADMIN_KEY_LS); sessionStorage.removeItem(ADMIN_TOKEN_SS); } catch (_) {}
      location.replace(location.pathname);
    });

    document.getElementById('key-toggle-btn').addEventListener('click', function () {
      const form = document.getElementById('key-form');
      form.hidden = !form.hidden;
      this.setAttribute('aria-expanded', String(!form.hidden));
      if (!form.hidden) document.getElementById('key-input').focus();
    });

    document.getElementById('user-form').addEventListener('submit', async function (ev) {
      ev.preventDefault();
      const btn = document.getElementById('user-btn');
      const msg = document.getElementById('user-msg');
      btn.disabled = true; msg.textContent = '';
      let j = null;
      try {
        const r = await fetch(apiBase + '/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('user-email').value,
                                 password: document.getElementById('user-password').value }),
        });
        if (r.status === 429) msg.textContent = 'Too many attempts: try again in a few minutes.';
        else if (!r.ok) msg.textContent = 'Invalid email or password.';
        else j = await r.json();
      } catch (_) { msg.textContent = 'Service unreachable.'; }
      if (j && !j.admin) msg.textContent = 'This account is not an administrator.';
      if (j && j.admin && await _validateAdminToken(j.token)) {
        _adminToken = j.token;
        try { sessionStorage.setItem(ADMIN_TOKEN_SS, j.token); } catch (_) {}
        // the same session for the chat below the panel: no second login (the widget's own keys)
        try { localStorage.setItem('zautte_token', j.token); localStorage.setItem('zautte_name', j.name || ''); } catch (_) {}
        try { localStorage.setItem('zautte_no_stats', '1'); } catch (_) {}
        startAdminView();
        return;
      }
      if (j && j.admin) msg.textContent = _keyError;
      btn.disabled = false;
    });

    document.getElementById('key-form').addEventListener('submit', async function (ev) {
      ev.preventDefault();
      const btn = document.getElementById('key-btn');
      const msg = document.getElementById('key-msg');
      const key = document.getElementById('key-input').value;
      btn.disabled = true; msg.textContent = '';
      if (await _validateAdminKey(key)) {
        _adminKey = key;
        try { sessionStorage.setItem(ADMIN_KEY_LS, key); } catch (_) {}
        // not a secret: only tells widget/matomo.js not to count this browser's page views
        try { localStorage.setItem('zautte_no_stats', '1'); } catch (_) {}
        startAdminView();
      } else {
        msg.textContent = _keyError;
        btn.disabled = false;
      }
    });

    (async function init() {
      if (_adminToken && await _validateAdminToken(_adminToken)) {
        try { localStorage.setItem('zautte_no_stats', '1'); } catch (_) {}
        startAdminView();
        return;
      }
      _adminToken = null;
      try { sessionStorage.removeItem(ADMIN_TOKEN_SS); } catch (_) {}
      if (_adminKey && await _validateAdminKey(_adminKey)) {
        try { localStorage.setItem('zautte_no_stats', '1'); } catch (_) {}
        startAdminView();
      } else {
        _adminKey = null;
        try { sessionStorage.removeItem(ADMIN_KEY_LS); } catch (_) {}
      }
    })();
  </script>
  <script src="/widget/site-footer.js?v=20261006d" defer></script>
</body>
</html>
